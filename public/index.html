<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registrasi Rombongan</title>
<style>
:root{--g:#1f5c4d;--o:#d4a62a;--bd:#d5ded9}*{box-sizing:border-box}
body{margin:0;background:#f6f8f5;color:#17302a;font:16px/1.5 system-ui,sans-serif}.w{max-width:620px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;color:var(--g);margin:.2rem 0}.c{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-weight:600;margin:10px 0 4px}input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font:inherit}
.r{display:flex;gap:8px}.r>*{flex:1}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
button{background:var(--g);color:#fff;border:0;border-radius:8px;padding:12px;font:inherit;font-weight:600;width:100%;margin-top:12px}
button.o{background:#fff;color:var(--g);border:1px solid var(--g)}.tabs{display:flex;gap:6px}.tabs button{margin:0}
.err{color:#c0392b;margin-top:8px}.ok{background:var(--g);color:#fff;border-radius:10px;padding:12px;margin-bottom:10px}
svg{width:100%;height:auto;border:1px solid var(--bd);border-radius:8px}.hide{display:none}
</style></head><body><div class="w">
<h1>Registrasi Rombongan</h1><p style="color:#5d716b;margin:0 0 12px">Isi data rombongan, lalu lihat denah &amp; nomor meja Anda.</p>
<div class="tabs"><button id="tR">Daftar</button><button class="o" id="tC">Cek Ulang</button></div><br>
<div id="vR" class="c"><label>Asal sekolah</label><input id="sch" maxlength="100">
<div class="r"><div><label>Jumlah siswa</label><input id="ns" type="number" min="1" max="100" value="1"></div>
<div><label>Jumlah guru</label><input id="ng" type="number" min="0" max="25" value="1"></div></div>
<label>HP guru pendamping</label><input id="gp" type="tel"><label>Data siswa (nama &amp; no. HP)</label><div id="stu"></div>
<button id="go">Kirim &amp; Lihat Denah</button><div class="err" id="er"></div></div>
<div id="vC" class="c hide"><label>Nama sekolah</label><input id="q"><button id="fq">Cari</button><div class="err" id="eq"></div></div>
<div id="res"></div></div>
<script>
const P={1:[232,405],2:[457,395],3:[665,393],4:[872,390],5:[344,532],6:[578,518],7:[773,516],8:[220,672],9:[456,648],10:[697,641],11:[906,636],12:[343,803],13:[578,779],14:[805,772],15:[211,948],16:[458,930],17:[706,908],18:[930,882],19:[327,1079],20:[582,1063],21:[826,1041],22:[204,1222],23:[427,1206],24:[684,1180],25:[936,1160]};
const VIP=[1,2,3,4,6],$=id=>document.getElementById(id);
function rows(){const n=Math.min(100,Math.max(1,+$('ns').value||1)),old=[...$('stu').querySelectorAll('input')].map(i=>i.value);$('stu').innerHTML='';
 for(let i=0;i<n;i++){const d=document.createElement('div');d.className='row';for(let j=0;j<2;j++){const x=document.createElement('input');x.placeholder=j?'No. HP':'Nama siswa '+(i+1);if(j)x.type='tel';x.value=old[i*2+j]||'';d.appendChild(x)}$('stu').appendChild(d)}}
$('ns').oninput=rows;rows();
function show(v){$('vR').classList.toggle('hide',v!=='R');$('vC').classList.toggle('hide',v!=='C');$('tR').className=v==='R'?'':'o';$('tC').className=v==='C'?'':'o';$('res').innerHTML=''}
$('tR').onclick=()=>show('R');$('tC').onclick=()=>show('C');
function draw(pl){const m={};[...pl.guru,...pl.siswa].forEach(x=>m[x.t]=(m[x.t]||0)+x.n);
 let s='<svg viewBox="0 0 1080 1530"><rect x="300" y="100" width="460" height="140" fill="#e4e4e4" stroke="#999"/><text x="530" y="170" text-anchor="middle" font-size="42" fill="#333">PANGGUNG</text><text x="860" y="205" font-size="24" fill="#666">PINTU MASUK MAKANAN</text><text x="95" y="860" font-size="26" fill="#666" transform="rotate(90 95 860)">PINTU MASUK UNDANGAN</text><text x="440" y="1380" font-size="24" fill="#666">PINTU KELUAR MAKANAN</text>';
 for(const t in P){const [x,y]=P[t],k=m[t],c=VIP.includes(+t)?'#d4a62a':'#1f5c4d';
  s+=`<circle cx="${x}" cy="${y}" r="${k?58:42}" fill="${c}" ${k?'stroke="#e2342d" stroke-width="12"':''}/><text x="${x}" y="${y+12}" text-anchor="middle" font-size="${k?44:34}" fill="#fff" font-weight="700">${t}</text>`;
  if(k)s+=`<text x="${x}" y="${y+92}" text-anchor="middle" font-size="28" fill="#e2342d" font-weight="700">${k} org</text>`}
 return s+'</svg>'}
function res(d,dup){const L=a=>a.map(x=>x.t).join(', ')||'-',r=$('res');r.innerHTML='';const c=document.createElement('div');c.className='c';
 const ok=document.createElement('div');ok.className='ok';ok.textContent=(dup?'Data ditemukan. ':'Pendaftaran berhasil! ')+d.school+' — '+d.guru+' guru, '+d.siswa+' siswa. Meja guru (oranye): '+L(d.plan.guru)+'. Meja siswa (hijau): '+L(d.plan.siswa)+'.';
 const w=document.createElement('div');w.innerHTML=draw(d.plan);const n=document.createElement('p');n.textContent='Lingkaran bergaris merah = meja rombongan Anda. Tunjukkan layar ini ke panitia.';
 c.append(ok,w,n);r.appendChild(c);try{localStorage.setItem('mine',d.school)}catch(e){}r.scrollIntoView()}
$('go').onclick=async()=>{$('er').textContent='';const i=[...$('stu').querySelectorAll('input')],stu=[];for(let k=0;k<i.length;k+=2)stu.push({n:i[k].value,p:i[k+1].value});
 $('go').disabled=true;try{const r=await fetch('/api/reg',{method:'POST',body:JSON.stringify({school:$('sch').value,siswa:+$('ns').value,guru:+$('ng').value,gp:$('gp').value,stu})}),j=await r.json();j.ok?res(j.data,j.dup):$('er').textContent=j.err}catch(e){$('er').textContent='Koneksi gagal, coba lagi.'}$('go').disabled=false};
$('fq').onclick=async()=>{$('eq').textContent='';try{const r=await fetch('/api/find?q='+encodeURIComponent($('q').value)),j=await r.json();j.ok?res(j.data,true):$('eq').textContent=j.err}catch(e){$('eq').textContent='Koneksi gagal.'}};
try{const m=localStorage.getItem('mine');if(m)fetch('/api/find?q='+encodeURIComponent(m)).then(r=>r.json()).then(j=>j.ok&&res(j.data,true))}catch(e){}
</script></body></html>
